<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neha 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    height:100vh;
    background:linear-gradient(135deg,#6dd5ed,#2193b0);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Poppins',sans-serif;
    overflow:hidden;
}

/* Glass card */
.card{
    width:440px;
    padding:35px 30px;
    background:rgba(255,255,255,0.88);
    border-radius:30px;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
    text-align:center;
    z-index:5;
}

.name{
    font-family:'Comic Neue',cursive;
    font-size:44px;
    color:#0b5ed7;
}

.tag{
    font-size:15px;
    color:#444;
    margin-bottom:15px;
}

#msg{
    font-size:17px;
    color:#111;
    line-height:1.9;
    min-height:260px;
    text-align:left;
}

/* Button */
.btn{
    margin-top:20px;
    padding:12px 38px;
    border:none;
    border-radius:30px;
    font-size:18px;
    background:#0b5ed7;
    color:white;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(11,94,215,0.4);
}
.btn:hover{transform:scale(1.08);}

/* Floating cute icons */
.float{
    position:absolute;
    font-size:24px;
    animation:float 8s linear infinite;
    opacity:0.8;
}

@keyframes float{
    from{transform:translateY(100vh) scale(1);}
    to{transform:translateY(-10vh) scale(1.4);opacity:0;}
}

/* Final screen */
.final{
    display:none;
    font-family:'Comic Neue',cursive;
    font-size:36px;
    color:white;
    text-align:center;
    animation:fade 2s ease;
}

@keyframes fade{
    from{opacity:0;transform:scale(0.7);}
    to{opacity:1;transform:scale(1);}
}
</style>
</head>

<body>

<!-- 🎵 BACKGROUND MUSIC (1 MIN + LOOP) -->
<audio id="song" autoplay muted loop>
    <source src="doraemon_theme_song.mp3" type="audio/mpeg">
</audio>

<div class="card" id="box">
    <div class="name">Neha 💙</div>
    <div class="tag">A small message, just for you 🌈</div>
    <div id="msg"></div>
    <button class="btn" onclick="enableSound()">Tap & Smile 😊</button>
</div>

<div class="final" id="final">
    Neha 🌟<br>
    Tum bilkul Doraemon jaisi ho 💙<br>
    Cute, strong & full of magic ✨<br><br>
    Never give up 🤍
</div>

<script>
/* MUSIC CONTROL */
const song = document.getElementById("song");
song.volume = 0.5;

/* Enable sound on first user interaction */
function enableSound(){
    song.muted = false;
    song.play();
    document.getElementById("box").style.display="none";
    document.getElementById("final").style.display="block";
}

/* LONG MOTIVATIONAL TEXT (typing effect) */
const text = `Hey Neha 💙

Ye sirf ek website nahi hai,
ye ek reminder hai 🌟

Kabhi kabhi life thodi
confusing, thodi heavy
aur thodi tiring ho jaati hai —
aur ye bilkul normal hai 🤍

Bilkul Doraemon ki tarah,
tumhare paas bhi
hidden powers hain 💫
Tum jitna sochti ho
us se kahin zyada strong ho 💪

Jab bhi lage ke
sab mushkil ho raha hai,
ya mood thoda off hai,
bas yaad rakhna —
tum akeli nahi ho 💙

Koi hai jo
tumhari smile,
tumhari mehnat,
aur tumhari feelings
sab notice karta hai 🌈

Slow chalo,
deep breath lo 😌
aur khud pe
thoda sa bharosa rakho ✨

Tum kar sakti ho.
Hamesha. 🌟`;

let i=0;
function type(){
    if(i<text.length){
        document.getElementById("msg").innerHTML+=text.charAt(i);
        i++;
        setTimeout(type,35);
    }
}
type();

/* Floating Doraemon-vibe icons */
const icons=["💙","⭐","✨","🌈","😊","🔔"];
function floatIcon(){
    const f=document.createElement("div");
    f.className="float";
    f.innerHTML=icons[Math.floor(Math.random()*icons.length)];
    f.style.left=Math.random()*100+"vw";
    f.style.animationDuration=(Math.random()*3+6)+"s";
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),9000);
}
setInterval(floatIcon,350);
</script>

</body>
</html>
